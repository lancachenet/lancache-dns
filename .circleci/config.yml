workflows:
  build_test_deploy:
    jobs:
      - test
      - publish_latest:
          context: docker-hub
          requires:
            - test
          filters:
            branches:
              only:
                - master

version: 2.1
executors:
  testbuild-executor:
    machine:
      image: default
jobs:
  test:
    executor: testbuild-executor
    steps:
      - checkout
      - run:
          name: Install goss
          command: |
            # rather than give internet scripts SU rights, we install to local user bin and add to path
            [ -d ~/bin ] || mkdir ~/bin
            export GOSS_DST=~/bin
            export PATH=$PATH:~/bin
            curl -fsSL https://goss.rocks/install | sh
            goss -version
      - run:
          name: Test
          command: |
            export PATH=$PATH:~/bin
            ./run-tests.sh circleci keepimage
      - run:
          name: Save docker image
          command: |
            [ -d workspace ] || mkdir workspace
            docker save -o workspace/lancachenet-lancache-dns.tar lancachenet/lancache-dns:goss-test
      - store_test_results:
          path: reports/goss/report.xml
      - store_artifacts:
          path: reports
          destination: reports
      - persist_to_workspace:
          root: workspace
          paths: lancachenet-lancache-dns.tar
  publish_latest:
    executor: testbuild-executor
    steps:
      - attach_workspace:
          at: /tmp/workspace
      - run:
          name: "Deploy latest to docker hub"
          command: |
            docker load -i /tmp/workspace/lancachenet-lancache-dns.tar
            docker login -u $DOCKER_USER -p $DOCKER_PASS
            docker tag lancachenet/lancache-dns:goss-test lancachenet/lancache-dns:latest
            docker push lancachenet/lancache-dns:latest
