version: 2.1

workflows:
  build_test_deploy:
    jobs:
      - test:
          matrix:
            parameters:
              arch: [amd64, arm64]
      - publish_latest:
          context: docker-hub
          requires:
            - test
          filters:
            branches:
              only:
                - master

executors:
  machine-amd64:
    machine:
      image: default
    resource_class: medium
  machine-arm64:
    machine:
      image: default
    resource_class: arm.medium

jobs:
  test:
    parameters:
      arch:
        type: enum
        enum: [amd64, arm64]
    executor: machine-<< parameters.arch >>
    steps:
      - checkout
      - run:
          name: Install goss
          command: |
            # rather than give internet scripts SU rights, we install to local user bin and add to path
            [ -d ~/bin ] || mkdir ~/bin
            export GOSS_DST=~/bin
            export PATH=$PATH:~/bin
            curl -fsSL https://goss.rocks/install | sh
            goss -version
      - run:
          name: Test
          command: |
            export PATH=$PATH:~/bin
            ./run-tests.sh circleci keepimage
      - run:
          name: Check image architecture
          command: |
            arch=$(docker image inspect -f '{{.Architecture}}' lancachenet/lancache-dns:goss-test)
            echo "Built for ${arch}"
            [ "${arch}" == "<< parameters.arch >>" ]
      - run:
          name: Save docker image
          command: |
            [ -d workspace ] || mkdir workspace
            docker tag lancachenet/lancache-dns:goss-test lancachenet/lancache-dns:goss-test-<< parameters.arch >>
            docker save -o workspace/lancachenet-lancache-dns-<< parameters.arch >>.tar lancachenet/lancache-dns:goss-test-<< parameters.arch >>
      - store_test_results:
          path: reports/goss/report.xml
      - store_artifacts:
          path: reports
          destination: reports-<< parameters.arch >>
      - store_artifacts:
          path: workspace/lancachenet-lancache-dns-<< parameters.arch >>.tar
          destination: docker-lancachenet-lancache-dns-<< parameters.arch >>.tar
      - persist_to_workspace:
          root: workspace
          paths:
            - lancachenet-lancache-dns-<< parameters.arch >>.tar
  publish_latest:
    executor: machine-amd64
    steps:
      - attach_workspace:
          at: /tmp/workspace
      - run:
          name: "Deploy latest to docker hub"
          command: |
            echo "$DOCKER_PASS" | docker login -u "$DOCKER_USER" --password-stdin
            for arch in amd64 arm64; do
              docker load -i /tmp/workspace/lancachenet-lancache-dns-${arch}.tar
              docker tag lancachenet/lancache-dns:goss-test-${arch} lancachenet/lancache-dns:latest-${arch}
              docker push lancachenet/lancache-dns:latest-${arch}
            done
            docker buildx imagetools create -t lancachenet/lancache-dns:latest lancachenet/lancache-dns:latest-amd64 lancachenet/lancache-dns:latest-arm64
